name: PDF Editor CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/pdf-editor/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/pdf-editor-cd.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pdf-editor-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build PDF editor
        run: |
          yarn twenty build
          yarn pdf:build

      - name: Upload secrets to Cloudflare
        run: |
          if [ -n "$GOTENBERG_API_BASIC_AUTH_USERNAME" ]; then
            printf '%s' "$GOTENBERG_API_BASIC_AUTH_USERNAME" | yarn workspace ima-pdf-editor wrangler secret put GOTENBERG_API_BASIC_AUTH_USERNAME
          fi
          if [ -n "$GOTENBERG_API_BASIC_AUTH_PASSWORD" ]; then
            printf '%s' "$GOTENBERG_API_BASIC_AUTH_PASSWORD" | yarn workspace ima-pdf-editor wrangler secret put GOTENBERG_API_BASIC_AUTH_PASSWORD
          fi
          if [ -n "$TWENTY_API_URL" ]; then
            printf '%s' "$TWENTY_API_URL" | yarn workspace ima-pdf-editor wrangler secret put TWENTY_API_URL
          fi
          if [ -n "$TWENTY_API_KEY" ]; then
            printf '%s' "$TWENTY_API_KEY" | yarn workspace ima-pdf-editor wrangler secret put TWENTY_API_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOTENBERG_API_BASIC_AUTH_USERNAME: ${{ secrets.GOTENBERG_API_BASIC_AUTH_USERNAME }}
          GOTENBERG_API_BASIC_AUTH_PASSWORD: ${{ secrets.GOTENBERG_API_BASIC_AUTH_PASSWORD }}
          TWENTY_API_URL: ${{ vars.TWENTY_API_URL }}
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}

      - name: Deploy to Cloudflare Workers
        run: yarn workspace ima-pdf-editor wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

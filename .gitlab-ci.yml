stages:
  - test
  - deploy

variables:
  YARN_CACHE_FOLDER: $CI_PROJECT_DIR/.yarn/cache
  COREPACK_HOME: $CI_PROJECT_DIR/.cache/Corepack

default:
  image: node:24.5.0-bookworm
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache/
      - .cache/Corepack/
  before_script:
    - mkdir -p "$YARN_CACHE_FOLDER" "$COREPACK_HOME"
    - corepack enable
    - yarn install --immutable

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  services:
    - name: twentycrm/twenty-app-dev:latest
      alias: twenty
      variables:
        NODE_ENV: development
        NODE_PORT: "2021"
        SERVER_URL: http://twenty:2021
  variables:
    TWENTY_API_URL: http://twenty:2021
    TWENTY_API_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyMDIwMjAyMC0xYzI1LTRkMDItYmYyNS02YWVjY2Y3ZWE0MTkiLCJ0eXBlIjoiQVBJX0tFWSIsIndvcmtzcGFjZUlkIjoiMjAyMDIwMjAtMWMyNS00ZDAyLWJmMjUtNmFlY2NmN2VhNDE5IiwiaWF0IjoxNzM1Njg5NjAwLCJleHAiOjQ4OTE0NDk2MDAsImp0aSI6IjIwMjAyMDIwLWY0MDEtNGQ4YS1hNzMxLTY0ZDAwN2MyN2JhZCJ9.bfQjfyN0NEtTCLE_xPyNcwonDzlSXFoP8kdCQTdnuDc
  script:
    - |
      node <<'EOF'
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const waitForHealthz = async () => {
        for (let attempt = 0; attempt < 180; attempt += 1) {
          try {
            const response = await fetch('http://twenty:2021/healthz');
            if (response.ok) {
              process.exit(0);
            }
          } catch {}

          await delay(2000);
        }

        process.exit(1);
      };

      await waitForHealthz();
      EOF
    - yarn test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_app:
  stage: deploy
  script:
    - yarn twenty remote add --as gitlab-ci --api-url "$TWENTY_API_URL" --api-key "$TWENTY_API_KEY"
    - yarn twenty deploy -r gitlab-ci
    - yarn twenty install -r gitlab-ci
  rules:
    - when: manual
      allow_failure: true

deploy_pdf_editor:
  stage: deploy
  script:
    - yarn twenty build
    - yarn pdf:build
    - |
      if [ -n "${GOTENBERG_API_BASIC_AUTH_USERNAME:-}" ]; then
        printf '%s' "$GOTENBERG_API_BASIC_AUTH_USERNAME" | yarn workspace ima-pdf-editor wrangler secret put GOTENBERG_API_BASIC_AUTH_USERNAME
      fi
      if [ -n "${GOTENBERG_API_BASIC_AUTH_PASSWORD:-}" ]; then
        printf '%s' "$GOTENBERG_API_BASIC_AUTH_PASSWORD" | yarn workspace ima-pdf-editor wrangler secret put GOTENBERG_API_BASIC_AUTH_PASSWORD
      fi
      if [ -n "${TWENTY_API_URL:-}" ]; then
        printf '%s' "$TWENTY_API_URL" | yarn workspace ima-pdf-editor wrangler secret put TWENTY_API_URL
      fi
      if [ -n "${TWENTY_API_KEY:-}" ]; then
        printf '%s' "$TWENTY_API_KEY" | yarn workspace ima-pdf-editor wrangler secret put TWENTY_API_KEY
      fi
    - yarn workspace ima-pdf-editor wrangler deploy
  rules:
    - when: manual
      allow_failure: true
